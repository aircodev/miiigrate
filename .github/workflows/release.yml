# Release binaries for the four supported targets, modeled on the workers
# monorepo's _rust-binary.yml: tag `vX.Y.Z` -> DRAFT GitHub release with one
# artifact per target (miiigrate-<target>.tar.gz + sha256).
#
# The release is created as a draft, titled `miiigrate X.Y.Z`, with the
# matching `## X.Y.Z` section of docs/changelog.md as its body — so watchers
# are only notified once the draft is published, description included:
#
#   gh release edit vX.Y.Z --draft=false
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

permissions:
  contents: write

jobs:
  create-release:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Body = the `## <version> — <date>` section of the changelog.
          awk -v ver="$VERSION" '
            /^## /{ if (on) exit; if ($2 == ver) { on = 1; next } }
            on
          ' docs/changelog.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::docs/changelog.md has no section for $VERSION — add it before tagging"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "miiigrate $VERSION" \
            --notes-file notes.md

  build:
    name: build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            linker_pkg: gcc-aarch64-linux-gnu
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker_pkg }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf miiigrate-${{ matrix.target }}.tar.gz miiigrate
          shasum -a 256 miiigrate-${{ matrix.target }}.tar.gz > miiigrate-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            target/${{ matrix.target }}/release/miiigrate-${{ matrix.target }}.tar.gz \
            target/${{ matrix.target }}/release/miiigrate-${{ matrix.target }}.tar.gz.sha256 \
            --clobber

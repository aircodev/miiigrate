# Release binaries for the four supported targets, modeled on the workers
# monorepo's _rust-binary.yml: tag `vX.Y.Z` -> GitHub release with one
# artifact per target (miiigrate-<target>.tar.gz + sha256).
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            linker_pkg: gcc-aarch64-linux-gnu
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker_pkg }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf miiigrate-${{ matrix.target }}.tar.gz miiigrate
          shasum -a 256 miiigrate-${{ matrix.target }}.tar.gz > miiigrate-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/miiigrate-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/miiigrate-${{ matrix.target }}.tar.gz.sha256
